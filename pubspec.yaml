name: previewport
description: "PreviewPort — live Flutter previews on your iPhone."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  mobile_scanner: ^7.4.0
  webview_flutter: ^4.14.1
  webview_flutter_web: ^0.2.3+4
  shared_preferences: ^2.5.4
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.0
  flutter_slidable: ^4.0.0
  skeletonizer: ^2.1.3
  flutter_bounceable: ^1.2.0
  toastification: ^2.3.0
  flutter_lucide: ^1.1.0
  qr_flutter: ^4.1.0
  connectivity_plus: ^6.1.4
  image_picker: ^1.2.3
  sensors_plus: ^7.1.0
  bonsoir: ^7.1.5
  http: ^1.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# path_provider_android 2.3.x currently pulls in package:jni, whose Android
# plugin does not configure correctly with this project's AGP 9 toolchain.
# Keep the latest pre-JNI implementation until that upstream combination lands.
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - assets/previewport-logo-transparent.png
