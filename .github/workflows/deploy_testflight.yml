name: Deploy to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build Number (leave blank to use GitHub run number)'
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  testflight-deploy:
    name: Build & Deploy iOS to TestFlight
    runs-on: macos-latest # Latest macOS runner with Xcode 26+ (iOS 26 SDK)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Print Xcode Version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Install Apple Distribution Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporal_keychain_pwd_123' }}
        run: |
          # 1. Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 2. Import distribution certificate (.p12)
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 3. Add to keychain search list
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # 4. Install provisioning profile (.mobileprovision)
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          PROFILE_PATH="$PROFILES_DIR/profile.mobileprovision"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          # 5. Extract and print provisioning profile UUID for debugging
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i "$PROFILE_PATH"))
          echo "Provisioning Profile UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Configure Xcode Code Signing
        run: |
          # Use sed to inject manual code signing settings into the Xcode project
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          # Replace automatic signing with manual signing for the Runner target
          # Add CODE_SIGN_STYLE, CODE_SIGN_IDENTITY, DEVELOPMENT_TEAM, and PROVISIONING_PROFILE_SPECIFIER
          # after each PRODUCT_BUNDLE_IDENTIFIER = com.previewport.app line in Runner target configs
          sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER = com\.previewport\.app;/{
            # Only modify Runner target (not RunnerTests)
            /RunnerTests/!{
              a\
              \				CODE_SIGN_IDENTITY = "Apple Distribution";\
              \				CODE_SIGN_STYLE = Manual;\
              \				DEVELOPMENT_TEAM = RRS43X8SMU;\
              \				PROVISIONING_PROFILE_SPECIFIER = "PreviewPort AppStore";
            }
          }' "$PBXPROJ"

          echo "✅ Code signing configured for manual signing"
          grep -A2 "CODE_SIGN_STYLE" "$PBXPROJ" || echo "Warning: CODE_SIGN_STYLE not found"

      - name: Determine Build Number
        id: build_num
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            echo "number=${{ github.event.inputs.build_number }}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Build iOS IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-number=${{ steps.build_num.outputs.number }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: previewport-ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload to Apple TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Write API key to all locations altool searches
          mkdir -p ~/.private_keys
          mkdir -p ~/.appstoreconnect/private_keys

          # Use printf to preserve newlines in the multi-line .p8 key
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          cp ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.appstoreconnect/private_keys/

          # Debug: verify key file exists and looks valid
          echo "Key file size: $(wc -c < ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8) bytes"
          head -1 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          # Trim any trailing whitespace from issuer ID
          ISSUER_ID=$(echo "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')
          KEY_ID=$(echo "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')

          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

